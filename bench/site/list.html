<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Bench List</title>
<style>.item { display: none; } .item.shown { display: list-item; }</style>
</head>
<body>
<h1>List</h1>
<p id="page">1</p>
<button id="next">Next</button>
<ul id="items"></ul>
<script>
var PER = 10, TOTAL = 30, page = 1;
var ul = document.getElementById('items');
for (var i = 1; i <= TOTAL; i++) {
  var li = document.createElement('li');
  li.className = 'item';
  li.textContent = 'Item ' + i;
  ul.appendChild(li);
}
function render() {
  var items = ul.querySelectorAll('.item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle('shown', Math.floor(i / PER) + 1 === page);
  }
  document.getElementById('page').textContent = String(page);
  document.getElementById('next').disabled = page >= Math.ceil(TOTAL / PER);
}
document.getElementById('next').addEventListener('click', function () {
  if (page < Math.ceil(TOTAL / PER)) { page++; render(); }
});
render();
</script>
</body>
</html>
