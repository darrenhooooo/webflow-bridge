name: Mirror from CNB

# 定时把 CNB 主仓 (yctech.com-darren/webflow-bridge) 同步到本 GitHub 仓库。
# CNB 仓库公开可匿名拉取，无需任何 Secrets。
# 本地日常推 CNB 即可，GitHub 侧由本 workflow 自动跟上（<=30min 延迟）。

on:
  schedule:
    - cron: '*/30 * * * *'   # 每 30 分钟
  workflow_dispatch:          # 也支持手动触发 (Actions 页 Run workflow)

permissions:
  contents: write             # 允许 push 到本仓库

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch CNB main
        run: |
          git remote add cnb https://cnb.cool/yctech.com-darren/webflow-bridge.git
          git fetch cnb main --force

      - name: Mirror CNB main -> origin main
        run: |
          git checkout -B main cnb/main
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/darrenhooooo/webflow-bridge.git" main --force

      - name: Mirror CNB tags -> origin tags
        run: |
          set -o pipefail
          # 用 --force 推 tag：GitHub 侧可能有 CNB 已删除或已改写的同名 tag，
          # 只有 force 才能让远端 tag 与 CNB 完全一致，否则 push 会被拒绝。
          git fetch cnb --tags --force
          remote="https://x-access-token:${GITHUB_TOKEN:-}@github.com/${GITHUB_REPOSITORY}.git"
          # 逐个 tag 推：一条 --force --tags 推全部时，任何一个 tag 被拒绝都会中断整批，
          # 后面的 tag 就同步不上了。逐个推才能把「平台限制」和「真错误」分开处理。
          skipped=()
          pushed=()
          failed=()
          for tag in $(git tag --list | sort -V); do
            if out=$(git push --force "$remote" "refs/tags/${tag}:refs/tags/${tag}" 2>&1); then
              pushed+=("$tag")
            elif printf '%s' "$out" | grep -q 'refusing to allow a GitHub App to create or update workflow'; then
              # 已知平台限制：GITHUB_TOKEN 是 GitHub App 身份，平台硬性禁止它创建/更新
              # .github/workflows/ 下的文件（permissions: 也没有 workflows 键可开）。
              # 回填旧 tag 会把该 tag 提交的整棵树带过去，其中 workflow 与当前默认分支
              # 不一致，于是被拒。将来的新 tag（workflow 与 main 一致）不受影响。
              # 因此这里只降级并提示，不算 job 失败。
              echo "::warning::tag $tag 被 GitHub 平台限制拒绝：GITHUB_TOKEN 作为 GitHub App 身份无权创建/更新 .github/workflows/ 下的文件（旧提交中的 workflow 与默认分支不一致）。请用用户身份手动推送一次：git push origin refs/tags/$tag:refs/tags/$tag --force"
              skipped+=("$tag")
            else
              # 不含平台限制签名 → 真错误：原样打印输出并计入失败
              printf '%s\n' "$out" >&2
              echo "推送 tag $tag 失败（非平台限制，真实错误）" >&2
              failed+=("$tag")
            fi
          done
          echo "已跳过（平台限制，需用用户身份创建一次）: ${skipped[*]:-无}"
          echo "已成功同步: ${pushed[*]:-无}"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "真实错误导致失败的 tag: ${failed[*]}" >&2
            exit 1
          fi

      - name: Create GitHub Releases for new tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 单轮失败只记一次账并 continue，循环结束后统一以失败计数决定 job 成败
          fail=0
          for tag in $(git tag --list 'v[0-9]*' | sort -V); do
            # 只处理 origin 上真实存在的 tag：本地可能因平台限制未能推上去，
            # 若不校验，gh release create 会在错误的位置新建同名 tag，语义就错了。
            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "origin 上不存在 tag $tag，跳过（不创建 Release）"
              continue
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "release $tag 已存在，跳过"
              continue
            fi
            # 切到该 tag 自己的源码树，保证构建出的附件与该版本一致
            if ! git checkout --quiet --detach "$tag"; then
              echo "检出 tag $tag 失败，跳过该 tag" >&2
              fail=$((fail + 1))
              continue
            fi
            # 正文优先取该 tag 的 CHANGELOG.md 中该版本的段落，取不到则退回 tag subject
            notes=$(awk -v ver="$tag" '
              $0 ~ "^## " ver "([[:space:]]|$)" {p=1; next}
              p && /^## / {exit}
              p {print}
            ' CHANGELOG.md)
            if [ -z "$notes" ]; then
              notes=$(git tag -l --format='%(contents:subject)' "$tag")
            fi
            ver=${tag#v}
            main_zip="dist/webflow-bridge-${ver}.zip"
            firefox_zip="ff/extension/dist/webflow-bridge-firefox-${ver}.zip"
            # 清掉上一轮遗留产物，避免不同版本的 zip 累积到同一个 Release
            rm -rf dist ff/extension/dist
            # 先构建 + 校验；全部通过之后才建 Release，避免留下没有附件的空 Release
            if ! python3 tools/rebuild_zip.py || [ ! -f "$main_zip" ]; then
              echo "主包构建或产物校验失败: $main_zip (tag $tag)，跳过该 tag" >&2
              fail=$((fail + 1))
              continue
            fi
            # Firefox 包按该 tag 是否带脚本决定；老 tag（如 v1.0.0）没有脚本，只发主包，不算失败
            uploads=("$main_zip")
            if [ -f ff/extension/rebuild_zip.py ]; then
              if ! python3 ff/extension/rebuild_zip.py || [ ! -f "$firefox_zip" ]; then
                echo "Firefox 包构建或产物校验失败: $firefox_zip (tag $tag)，跳过该 tag" >&2
                fail=$((fail + 1))
                continue
              fi
              uploads+=("$firefox_zip")
            else
              echo "tag $tag 无 ff/extension/rebuild_zip.py，只发布主包"
            fi
            # 校验全部通过后才创建 Release，然后上传实际存在的产物
            gh release create "$tag" --title "Webflow Bridge $tag" --notes "$notes"
            gh release upload "$tag" "${uploads[@]}" --clobber
          done
          [ "$fail" -eq 0 ] || exit 1
