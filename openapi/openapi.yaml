openapi: 3.0.3
info:
  title: Webflow Bridge Command API
  version: 1.2.5
  description: >-
    Protocol-compatible agent-tool surface for browser bridges, driven over
    plain HTTP (zero SDK, any HTTP client works).
servers:
  - url: http://127.0.0.1:10086
    description: >-
      Local daemon (daemon/webflow_bridge.py); the extension link (WS
      ws://127.0.0.1:10087) is internal and not part of this API.
paths:
  /command:
    post:
      operationId: command
      summary: Dispatch one browser-driver command
      description: >-
        The bridge's single endpoint: name an action plus its args, and the
        command is forwarded to the one connected Chrome/Edge extension
        (session "default"). Always 200 with an ok or error envelope, except
        403 (non-localhost Origin header, CSRF guard) and 503 (no extension).
        Every response — including 401/403/503/404 — additionally carries a
        top-level "browser" field naming which browser the connected
        extension runs in ("chrome" | "edge" | "" when none is connected).
        A response may also carry an additive top-level "notice" object with
        unsolicited feedback (auto dialog-accept failure, download started,
        control moved to a new tab).
        Args are free-form (see schemas.Args); no bespoke SDK — this
        description alone lets curl, n8n, fetch or any generic HTTP client
        drive the bridge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
      responses:
        '200':
          description: >-
            Command processed. Two 200 shapes discriminated by "status": ok —
            {"status":"ok","data":{"value":<json-safe result>}}; error —
            {"status":"error","error":"<message>"} for argument/action-level
            failures (missing or invalid args, unknown action, extension
            failure, timeout).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >-
            Unauthorized — missing or invalid Authorization: Bearer token
            (shared-secret auth; token in ~/.webflow_bridge/token).
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - browser
                properties:
                  error:
                    type: string
                    const: 'unauthorized: missing or invalid bearer token'
                  browser:
                    $ref: '#/components/schemas/Browser'
        '403':
          description: >-
            Cross-origin POST blocked — Origin header outside
            http://127.0.0.1:10086 / http://localhost:10086 ("null" sandbox/file
            origins are deliberately rejected). Plain scripts/curl send no
            Origin header and never hit this after authenticating.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http403'
        '503':
          description: >-
            Extension not connected: the daemon has no Chrome/Edge extension
            WebSocket on :10087 to forward the command to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Http503'
  /status:
    get:
      operationId: status
      summary: Report bridge connection state (no browser action)
      description: >-
        Answers whether a Chrome/Edge extension is connected and which browser
        it runs in, without triggering any browser action. Requires the same
        Authorization: Bearer token as POST /command (missing or invalid ->
        401). Always 200 once authenticated — "nothing connected" is reported
        in the body, not as 503.
      responses:
        '200':
          description: >-
            Connection snapshot. extension_connected is false and browser ""
            when no extension is connected.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/ConnectionStatus'
        '401':
          description: >-
            Unauthorized — missing or invalid Authorization: Bearer token.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    const: 'unauthorized: missing or invalid bearer token'

components:
  schemas:
    Action:
      type: string
      description: The browser-driver action to run.
      enum:
        - evaluate
        - navigate
        - cdp
        - probe
        - tabs_list
        - tabs_open
        - tabs_close
        - tabs_close_all_but
        - tabs_activate
        - find_tab
        - snapshot
        - click
        - fill
        - screenshot
        - upload
        - handle_file_chooser
        - save_as_pdf
        - mouse_click
        - send_key
        - type_text
        - handle_dialog
        - set_dialog_policy
        - list_downloads
        - submit
        - fill_form
        - wait_for
    Args:
      type: object
      additionalProperties: true
      description: >-
        Free-form per-action arguments (unknown keys ignored). Per-action
        fields:
        evaluate           code (string, required) JS to run in the page MAIN
                           world; tabId (int, optional).
        navigate           url (string, required, http/https) page to load;
                           newTab (boolean, optional) opens it in a fresh
                           active tab; group_title (string, optional, only
                           used when newTab is true) titles that new tab's
                           group; tabId (int, optional, ignored when newTab is
                           true).
        cdp                method (string, required) any DevTools Protocol
                           method (Input.insertText, Page.reload, DOM.*, ...);
                           params (object, optional) CDP method params;
                           tabId (int, optional).
        find_tab           url (string, required) matched against open tabs'
                           URLs (exact, then prefix, then substring;
                           current-window tabs first); active (boolean,
                           optional) focuses the matched tab; never opens a
                           tab.
        snapshot           max (integer, optional, positive; default 400) caps
                           the a11y-style node list; tabId (int, optional).
        click              selector (string, required) CSS selector or a
                           snapshot "@eN" ref; tabId (int, optional).
        fill               selector (string, required); value (string,
                           required) text to enter; mode ("auto" | "value" |
                           "contenteditable", optional, default "auto");
                           tabId (int, optional).
        screenshot         format ("png" | "jpeg", optional, default "png");
                           quality (integer 0-100, optional, jpeg only);
                           selector (string, optional) CSS or "@eN" element
                           clip; fullPage (boolean, optional) whole-page
                           capture; tabId (int, optional).
        upload             selector (string, required) CSS selector or "@eN"
                           for the target <input type="file">; file (string,
                           required) absolute local path the browser process
                           reads; tabId (int, optional).
        handle_file_chooser file (string, required) absolute local path to set
                           on an intercepted file chooser (native dialog is
                           suppressed; a file input / custom upload control
                           must have been clicked first); timeoutMs (integer,
                           optional, positive, default 3000) max wait for the
                           chooser to open; tabId (int, optional).
        save_as_pdf        no args — always prints the ACTIVE tab (no tabId).
        mouse_click        x (integer, optional); y (integer, optional);
                           selector (string, optional) CSS or "@eN" — when
                           given, scrolls into view and wins over x/y; tabId
                           (int, optional).
        send_key           key (string, required) Enter/Tab/Escape/Backspace/
                           Delete/Arrows/Home/End/PageUp/PageDown/Space or
                           a-z/0-9; modifiers (string[], optional) entries
                           alt/ctrl/meta/shift; tabId (int, optional).
        type_text          text (string, required) inserted at the caret via
                           CDP Input.insertText; selector (string, optional)
                           CSS or "@eN" focused first; tabId (int, optional).
        handle_dialog      accept (boolean, optional, default true) OK vs
                           Cancel/leave; promptText (string, optional) answer
                           to a prompt(); timeoutMs (integer 1..15000,
                           optional, default 2000) max wait for the dialog to
                           open; tabId (int, optional; may name a non-active
                           tab whose dialog is pending, so a dialog on one
                           tab can be resolved while another stays active).
                           With the default
                           auto-accept policy the dialog is usually already
                           resolved, so this answers "no JavaScript dialog is
                           showing within <n>ms". A dialog opened in manual
                           mode is resolved directly (the blocked actions do
                           not detach the session). A dialog that predated
                           the debugger attach has no opening event and cannot
                           be resolved at all.
        set_dialog_policy  policy (string, required) "auto-accept" | "manual"
                           — switch native-dialog handling at runtime (works
                           while a dialog blocks the page; no browser
                           action). Mirrored in GET /status dialog_policy.
        list_downloads     limit (integer, optional, positive) caps the
                           newest-first native-download record. No browser
                           action.
        probe              no args — returns the extension per-path diagnostic
                           matrix.
        tabs_list          no args — returns one entry per open tab.
        tabs_open          url (string, required, http/https) opens a new tab
                           (which becomes active) and returns its id.
        tabs_close         tabId (int, optional) — close a tab (default:
                           active).
        tabs_close_all_but tabId (int, optional) — close every other tab in
                           that tab's window (default: active).
        tabs_activate      tabId (int, optional) — focus a tab (default:
                           active).

        tabId is optional on every action that targets an existing tab
        (evaluate, navigate, cdp, snapshot, click, fill, screenshot, upload,
        handle_file_chooser, save_as_pdf, mouse_click, send_key, type_text,
        tabs_close, tabs_close_all_but, tabs_activate) and defaults to the extension's active tab. tabs_open
        (and navigate with newTab: true) makes the new tab active, so an
        evaluate right after it targets the freshly opened page. find_tab
        takes no tabId — it searches every window; save_as_pdf takes no
        tabId — it always prints the active tab.
    Command:
      type: object
      description: The POST /command request body.
      required:
        - action
        - session
      properties:
        action:
          $ref: '#/components/schemas/Action'
        args:
          $ref: '#/components/schemas/Args'
        session:
          type: string
          default: default
          description: Connection slot; only "default" is served (others
            answer 200 {"status":"error",...}).
      example:
        action: evaluate
        args:
          code: (() => document.title)()
        session: default
    OkResponse:
      type: object
      description: Successful command result.
      properties:
        status:
          type: string
          enum: [ok]
        browser:
          $ref: '#/components/schemas/Browser'
        data:
          type: object
          properties:
            value:
              description: >-
                JSON-safe result (string/number/boolean/array/object/null). By
                action: evaluate the evaluated value; cdp the raw CDP result;
                snapshot {url, title, nodes: [{ref, tag, role, name, text,
                path}, ...]}; click {success, tag, text}; fill {success, tag,
                mode}; find_tab {success, url, tabId} or {success: false,
                error}; tabs_list an array of tabs; tabs_open {"id","url"};
                tabs_close {"closed":<tabId>}; tabs_close_all_but
                {"closed":<count>}; tabs_activate {"tabId","active":true};
                probe {tab, paths, dialog:{policy, pending:{tabId, type,
                message, defaultPrompt, url}, lastError, blocking},
                downloads:{count, last}} (dialog blocking is per-tab:
                blocking is true only when pending belongs to the probed tab,
                and only then is every path marked "skipped: ..."; pending
                always carries the owning tabId);
                screenshot {base64, mime, width, height};
                upload {success, file, tag}; save_as_pdf {base64,
                mime:"application/pdf"}; mouse_click {success, x, y};
                send_key {success, key}; type_text {success, len};
                handle_dialog {success, dialog:{type, message,
                defaultPrompt}, accept, promptText}; set_dialog_policy
                {policy, extension_notified}; list_downloads {downloads,
                count}; navigate {} (or {success, tabId, groupId?} when
                args.newTab is true).
      required:
        - status
        - data
        - browser
    ErrorResponse:
      type: object
      description: 200-level failure (argument, action or extension error).
      properties:
        status:
          type: string
          enum: [error]
        browser:
          $ref: '#/components/schemas/Browser'
        error:
          type: string
          description: Human-readable failure reason.
      required:
        - status
        - error
        - browser
    Http403:
      type: object
      description: CSRF guard rejection (browser-originated cross-origin POST).
      properties:
        error:
          type: string
          const: cross-origin POST blocked
        browser:
          $ref: '#/components/schemas/Browser'
      required:
        - error
        - browser
    Http503:
      type: object
      description: No extension WebSocket is connected to the daemon.
      properties:
        error:
          type: string
          const: extension not connected
        browser:
          $ref: '#/components/schemas/Browser'
      required:
        - error
        - browser
    Browser:
      type: string
      enum: ['chrome', 'edge', '']
      description: >-
        Browser the connected extension runs in; "" when no extension is
        connected or its User-Agent was unrecognised. Stamped on every
        /command response and returned in GET /status data.
    ConnectionStatus:
      type: object
      description: >-
        Connection snapshot returned by GET /status. Deliberately connection +
        settings only, and always fast: it never triggers a browser action, so
        it cannot prove the debugger can act on the current page. Native
        dialogs are handled by the dialog_policy setting; for an activity check
        use the probe action, which answers in milliseconds with
        dialog.blocking=true and skipped paths while a dialog is blocking a
        page.
      properties:
        extension_connected:
          type: boolean
          description: True when an extension WebSocket is currently connected.
        browser:
          $ref: '#/components/schemas/Browser'
        ws_port:
          type: integer
          description: WebSocket port the extension connects to (10087).
        connected_since:
          type: string
          format: date-time
          nullable: true
          description: >-
            Local-timezone ISO 8601 timestamp of when the current connection
            was established; null when none is connected.
        extension_stale:
          type: boolean
          description: >-
            True when the extension's own JS heartbeat has gone quiet (MV3
            service worker suspended). Describes the extension JS, not the
            debugger session.
        last_extension_frame_ms_ago:
          type: integer
          nullable: true
          description: >-
            Milliseconds since the last application-level frame from the
            extension; null when nothing is connected.
        dialog_policy:
          type: string
          enum: [auto-accept, manual]
          description: >-
            Live native-dialog policy. auto-accept (default) resolves every
            alert/confirm/prompt/beforeunload immediately; manual leaves it
            for handle_dialog.
        last_notice:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Newest unsolicited extension notice ({kind, text, at, ...}) — an
            auto dialog-accept failure, a download started, or control moved
            to a new tab. The same object is attached to the next POST
            /command response as a top-level notice.
      required:
        - extension_connected
        - browser
        - ws_port
        - connected_since
