<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Webflow Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header: logo + title + the stable connection action slot (top-right).
       Disconnect while Active; the same slot flips to Reconnect after the user
       pauses — it never moves. The version is no longer a header chip: static
       metadata is not an action, so it lives in the footer below. -->
  <header class="head">
    <img class="logo" src="assets/icons/icon128.png"
         alt="Webflow Bridge logo" width="20" height="20" draggable="false">
    <h1 class="title">Webflow Bridge</h1>
    <button id="connBtn" type="button" class="conn-btn hidden"
            aria-label="Disconnect">Disconnect</button>
  </header>

  <!-- Main card = the whole-card status display (整卡状态显示器). role=button /
       tabindex make the whole card clickable; content is one dot + the state
       word, horizontally centred. data-state drives the card surface:
       checking (neutral grey, probing) / inactive (red fill — click opens the
       activation checklist below) / active (green fill — click runs one real
       evaluate → friendly confirmation) / disconnected (neutral, user paused
       the link — not clickable). Port / local-daemon rows removed; the version
       lives once, in the footer below. -->
  <div id="mainCard" role="button" tabindex="0" aria-disabled="true" aria-busy="true"
       class="card main-card" data-state="checking">
    <!-- One icon slot, three states (CSS toggles): spinner = probing, alert =
         inactive, a white breathing disc = active (restored from 88ce764^).
         There is no static checkmark: the label plus the breathing motion carry
         Active without relying on colour, and the disc stays put when
         reduced-motion stops the breath. -->
    <span class="state-icon" aria-hidden="true">
      <svg class="si si-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-6.4 2.6"/></svg>
      <svg class="si si-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5h.01"/></svg>
      <svg class="si si-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"/></svg>
    </span>
    <span id="mainWord" class="main-word" aria-live="polite" aria-atomic="true">Checking…</span>
    <!-- Sub-line under the state word: on Inactive it names the reason (the
         daemon is not running), so the red banner never contradicts a green
         "ready" row. Empty and hidden in every other state. -->
    <span id="mainReason" class="main-reason" hidden></span>
  </div>

  <!-- Activation checklist: one row per condition; a failing row carries the
       fix steps (real daemon command + Copy button, reload URL, page switch).
       The list follows the live state automatically; the Re-check button at
       its foot re-runs the exact same diagnosis after the user acts. -->
  <section id="wizard" class="card wizard hidden">
    <ul id="wizRows" class="wiz-rows"></ul>
    <button id="wizRecheck" type="button" class="recheck-btn" data-i18n="recheck">Re-check</button>
  </section>

  <!-- Friendly confirmation shown once the Active channel is verified -->
  <pre id="result" class="result hidden" role="status" aria-live="polite"></pre>

  <!-- Version = static metadata (moved out of the header action slot). -->
  <footer class="foot"><span id="version" class="version">v…</span></footer>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
